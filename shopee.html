<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Fredoka", "Baloo 2", "Nunito", "Segoe UI", sans-serif;
    background: #f5f5f5;
    width: 360px;
  }

  /* ===== HEADER ===== */
  .header {
    background: linear-gradient(180deg, #f53d2d, #f63);
    padding: 14px 14px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,.28);
    flex-shrink: 0;
    overflow: hidden;
  }
  .logo img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    border-radius: inherit;
    padding: 2px;
    box-sizing: border-box;
  }
  .search {
    flex: 1;
    background: #fff;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 12px;
    color: #bbb;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .search svg { flex-shrink: 0; }

  /* ===== USER STRIP ===== */
  .user {
    background: #fff;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #f0f0f0;
    font-size: 12px;
    color: #555;
  }
  .user .name { font-weight: 600; color: #222; }
  .user .bal { color: #ee4d2d; font-weight: 700; }

  /* ===== ITEM (CENTER) ===== */
  .item { background: #fff; }
  .item-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #fafafa;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 120px;           /* for emoji */
    position: relative;
    overflow: hidden;
  }
  .item-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge {
    position: absolute;
    top: 0; right: 0;
    background: rgba(255,212,36,.95);
    color: #ee4d2d;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 6px 6px;
    text-align: center;
    line-height: 1.2;
    clip-path: polygon(0 0,100% 0,100% 100%,50% 88%,0 100%);
  }
  .badge small { display: block; color: #fff; font-size: 10px; }

  .info { padding: 12px 14px 14px; }
  .price-row { display: flex; align-items: baseline; gap: 8px; }
  .price { color: #ee4d2d; font-size: 24px; font-weight: 700; }
  .price::first-letter { font-size: 16px; }
  .old { color: #aaa; font-size: 13px; text-decoration: line-through; }
  .off {
    color: #ee4d2d; background: #fdeae6;
    font-size: 11px; font-weight: 700;
    padding: 1px 8px; border-radius: 10px;
  }
  .title {
    margin-top: 8px;
    font-size: 15px;
    color: #222;
    line-height: 1.35;
    font-weight: 500;
  }
  .meta {
    margin-top: 8px;
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: #777;
    align-items: center;
  }
  .meta .star { color: #ee4d2d; font-weight: 600; }

  /* ===== TAGS ===== */
  .tags { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 10px; padding: 2px 8px; border-radius: 10px;
    border: 1px solid #ee4d2d; color: #ee4d2d;
  }
  .tag.green { border-color: #26aa99; color: #26aa99; }

  /* ===== FOOTER BAR ===== */
  .footer { display: flex; height: 48px; }
  .footer div {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 13px; font-weight: 600;
  }
  .footer .chat { flex: 1; background: #fff; color: #ee4d2d; border-top: 1px solid #eee; }
  .footer .cart { flex: 1; background: #26aa99; color: #fff; }
  .footer .buy  { flex: 1.5; background: #ee4d2d; color: #fff; }
</style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="logo"><img src="{{LOGO}}" alt="Shopee"></div>
    <div class="search"><span>Search in Shopee</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ee4d2d" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    </div>
  </div>

  <!-- USER -->
  <div class="user">
    <span class="name">{{USERNAME}}</span>
    <span>Balance: <span class="bal">₱{{BALANCE}}</span></span>
  </div>

  <!-- ITEM -->
  <div class="item">
    <div class="item-img">
      {{ITEM_IMAGE}}  <!-- emoji like 👜 or <img src="..."> -->
      <div class="badge">{{DISCOUNT}}%<small>OFF</small></div>
    </div>

    <div class="info">
      <div class="price-row">
        <span class="price">₱{{PRICE}}</span>
        <span class="old">₱{{OLD_PRICE}}</span>
        <span class="off">-{{DISCOUNT}}%</span>
      </div>

      <div class="title">{{ITEM_NAME}}</div>

      <div class="meta">
        <span class="star">★ {{RATING}}</span>
        <span>|</span>
        <span>{{SOLD}} sold</span>
        <span>|</span>
        <span>{{STOCK}} left</span>
      </div>

      <div class="tags">
        <span class="tag">Free Shipping</span>
        <span class="tag green">Cash on Delivery</span>
        <span class="tag">Shopee Mall</span>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="chat">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5c-1.6 0-3.1-.4-4.4-1.1L3 20l1.1-5.1A8.5 8.5 0 1 1 21 11.5z"/></svg>
      Chat
    </div>
    <div class="cart">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.4a1.5 1.5 0 0 0 1.5 1.1h8.8a1.5 1.5 0 0 0 1.5-1.2L21 7H6"/></svg>
      Add to Cart
    </div>
    <div class="buy">Buy Now</div>
  </div>

</body>
</html>
