<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flaming Border</title>
<style>
  :root {
    --bg-1: #1c0702;
    --bg-2: #060302;
    --core: #ffe08a;
    --inside: #110704;
    --text: #ffd9a0;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 70%, var(--bg-1) 0%, var(--bg-2) 75%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
  }

  #fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  .box {
    position: relative;
    z-index: 1;
    width: min(80vw, 420px);
    height: 140px;
    display: grid;
    place-items: center;
    background: var(--inside);
    border: 1px solid color-mix(in srgb, var(--core) calc(var(--lvl, 0) * 100%), #6b4a2a);
    border-radius: 4px;
    letter-spacing: .3em;
    text-transform: uppercase;
    font-weight: 700;
    text-shadow: 0 0 12px #ff6a00, 0 0 28px #ff3d00;
    }

  /* border glow lives on a pseudo-element so its strength can fade with --lvl */
  .box::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    pointer-events: none;
    opacity: var(--lvl, 0);
    animation: flicker 1.7s infinite ease-in-out;
  }

  /* irregular glow pulses so the border light never looks steady */
  @keyframes flicker {
    0%, 100% { box-shadow: 0 0 3px #ffb300, 0 0 9px rgba(255,106,0,.8), 0 0 18px rgba(255,60,0,.35); }
    18%      { box-shadow: 0 0 2px #ffb300, 0 0 6px rgba(255,106,0,.6), 0 0 12px rgba(255,60,0,.25); }
    35%      { box-shadow: 0 0 4px #ffc83d, 0 0 11px rgba(255,122,0,.9), 0 0 22px rgba(255,60,0,.45); }
    58%      { box-shadow: 0 0 3px #ffb300, 0 0 8px rgba(255,106,0,.7), 0 0 16px rgba(255,60,0,.3); }
    77%      { box-shadow: 0 0 4px #ffc83d, 0 0 10px rgba(255,122,0,.85), 0 0 20px rgba(255,60,0,.4); }
  }
</style>
</head>
<body>

<canvas id="fx"></canvas>
<div class="box">Fire</div>

<script>
(() => {
  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  const box = document.querySelector('.box');
  let W, H, rect;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const r = box.getBoundingClientRect();
    rect = { x: r.left, y: r.top, w: r.width, h: r.height };
  }
  addEventListener('resize', resize);
  resize();

  // Pre-rendered soft sprites, one per stage of cooling: white-yellow -> orange -> red -> dark ember
  const stops = [
    [0.00, [255, 250, 210]],
    [0.25, [255, 200, 60]],
    [0.55, [255, 95, 15]],
    [0.85, [150, 25, 0]],
    [1.00, [60, 10, 0]]
  ];
  function colorAt(t) {
    for (let i = 1; i < stops.length; i++) {
      if (t <= stops[i][0]) {
        const [t0, c0] = stops[i - 1], [t1, c1] = stops[i];
        const k = (t - t0) / (t1 - t0);
        return c0.map((v, j) => Math.round(v + (c1[j] - v) * k));
      }
    }
    return stops[stops.length - 1][1];
  }
  const STAGES = 40, sprites = [];
  for (let i = 0; i < STAGES; i++) {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const [r, gr, b] = colorAt(i / (STAGES - 1));
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0,  `rgba(${r},${gr},${b},1)`);
    grad.addColorStop(0.4, `rgba(${r},${gr},${b},.5)`);
    grad.addColorStop(1,  `rgba(${r},${gr},${b},0)`);
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    sprites.push(c);
  }

  // Random point on the rectangle edge, with its outward normal and a height factor
  function pick() {
    const { x, y, w, h } = rect;
    let d = Math.random() * 2 * (w + h);
    if (d < w) return { x: x + d, y, nx: 0, ny: -1, k: 1.15 };       // top: tallest flames
    d -= w;
    if (d < h) return { x: x + w, y: y + d, nx: 1, ny: 0, k: 1 };     // right
    d -= h;
    if (d < w) return { x: x + w - d, y: y + h, nx: 0, ny: 1, k: 0.4 }; // bottom: short
    d -= w;
    return { x, y: y + h - d, nx: -1, ny: 0, k: 1 };                  // left
  }

  const parts = [], sparks = [];
  let acc = 0, sparkAcc = 0, time = 0, last = performance.now(), lvl = 0;

  function spawn() {
    const p = pick();
    parts.push({
      x: p.x + (Math.random() - 0.5) * 6,
      y: p.y,
      vx: p.nx * (3 + Math.random() * 8) + (Math.random() - 0.5) * 8,
      vy: p.ny * (8 + Math.random() * 20) - (25 + Math.random() * 40) * p.k,
      life: (0.3 + Math.random() * 0.3) * p.k * (0.35 + 0.65 * lvl),
      age: 0,
      size: 5 + Math.random() * 6,
      seed: Math.random() * 6.28
    });
  }
  function spawnSpark() {
    const p = pick();
    sparks.push({
      x: p.x, y: p.y,
      vx: (Math.random() - 0.5) * 50,
      vy: -(40 + Math.random() * 70),
      life: 0.5 + Math.random() * 0.6,
      age: 0,
      s: 0.5 + Math.random() * 0.9,
      seed: Math.random() * 6.28
    });
  }

  function tick(dt) {
    time += dt;
    ctx.clearRect(0, 0, W, H);

    // ambient light cast by the fire, flickering
    const fl = lvl * (0.06 + 0.02 * (Math.sin(time * 13) + Math.sin(time * 7.3) + Math.sin(time * 3.1)) / 3);
    const cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2, R = Math.max(rect.w, rect.h) * 1.2;
    const amb = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    amb.addColorStop(0, `rgba(255,90,10,${fl})`);
    amb.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = amb;
    ctx.fillRect(0, 0, W, H);

    // emit
    const perim = 2 * (rect.w + rect.h);
    acc += perim * 1.8 * lvl * dt;
    while (acc >= 1) { spawn(); acc--; }
    sparkAcc += 28 * lvl * dt;
    while (sparkAcc >= 1) { spawnSpark(); sparkAcc--; }

    // flames (additive so overlaps burn brighter)
    ctx.globalCompositeOperation = 'lighter';
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.age += dt;
      if (p.age >= p.life) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
      const t = p.age / p.life;
      p.vy -= 90 * dt;                                    // buoyancy
      p.vx += Math.sin(time * 7 + p.seed) * 30 * dt;      // sway
      p.vx *= 1 - 1.2 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const r = p.size * (1 - t * 0.75);
      ctx.globalAlpha = Math.min(1, (1 - t) * 1.4) * 0.85;
      ctx.drawImage(sprites[Math.min(STAGES - 1, (t * STAGES) | 0)], p.x - r, p.y - r, r * 2, r * 2);
    }

    // embers
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.age += dt;
      if (s.age >= s.life) { sparks[i] = sparks[sparks.length - 1]; sparks.pop(); continue; }
      const t = s.age / s.life;
      s.vx += Math.sin(time * 5 + s.seed) * 60 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      ctx.globalAlpha = (1 - t) * (0.6 + 0.4 * Math.sin(time * 30 + s.seed));
      ctx.fillStyle = `rgb(255,${(190 - 90 * t) | 0},60)`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.s, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // idle by default; a tap ramps the fire up for 2.5s, then it eases out until nothing is left burning
  let running = false, runUntil = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const target = now < runUntil ? 1 : 0;
    lvl += (target - lvl) * Math.min(1, dt * (target ? 6 : 2.2));
    if (!target && lvl < 0.01) lvl = 0;
    box.style.setProperty('--lvl', lvl.toFixed(3));
    tick(dt);
    if (target || lvl > 0 || parts.length || sparks.length) requestAnimationFrame(frame);
    else running = false;
  }
  function ignite() {
    runUntil = performance.now() + 2500;
    if (running) return;
    running = true;
    last = performance.now();
    requestAnimationFrame(frame);
  }
  addEventListener('pointerdown', ignite);
})();
</script>
</body>
</html>
