<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GKas</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #0b63f6;
    --blue-dark: #0846b8;
    --blue-light: #e8f0ff;
    --ink: #0d2250;
    --muted: #6b7fa8;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    background: transparent;
    width: 380px;
  }
  .phone {
    width: 380px;
    overflow: hidden;
    background: transparent;
  }
  .top {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px; min-width: 0;
    background: var(--blue-light);
  }
  .logo { flex: none; width: 42px; height: 42px; display: block; }
  .hello {
    font-size: 20px; font-weight: 900; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .wallet { background: var(--white); }

  /* balance lives inside the blue bar, white text — like the real app */
  .blue-bar {
    background: linear-gradient(90deg, var(--blue) 0%, var(--blue-dark) 100%);
    padding: 14px 20px 18px;
  }
  .label {
    font-size: 11px; font-weight: 800;
    color: rgba(255, 255, 255, 0.72);
    letter-spacing: .05em;
  }
  .balance {
    margin-top: 6px;
    font-size: 34px; font-weight: 900;
    color: var(--white);
    letter-spacing: -.01em;
  }

  .num-box { padding: 18px 20px 20px; }
  .num-label { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .04em; }
  .num-row {
    margin-top: 8px;
    background: var(--blue-light);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .number { font-size: 26px; font-weight: 900; color: var(--blue-dark); letter-spacing: .14em; }
  .hint { margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
</style>
</head>
<body>
<main class="phone" id="card">
  <div class="top">
    <img class="logo" id="logo-img" alt="" />
    <div class="hello" id="hello">Hello!</div>
  </div>
  <section class="wallet">
    <div class="blue-bar">
      <div class="label">AVAILABLE BALANCE</div>
      <div class="balance" id="balance">₱ 0</div>
    </div>
    <div class="num-box">
      <div class="num-label">YOUR GKAS NUMBER</div>
      <div class="num-row"><div class="number" id="number">09</div></div>
      <div class="hint">Share this number to receive money from other players.</div>
    </div>
  </section>
</main>
</body>
</html>
